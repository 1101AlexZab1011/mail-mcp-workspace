# Copy with: npm run workflow:init
# This file controls behavior only. Credentials remain in email-mcp's local config.

[defaults]
routing_mode = "provider" # provider | watcher; only one router may be active per account
filing_mode = "review" # review | propose | existing-folders | managed-groups
approved_folders = []


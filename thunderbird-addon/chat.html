<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Agent</title>
<link rel="icon" href="icons/smart_toy.svg">
<link rel="stylesheet" href="shared/ui.css">
<link rel="stylesheet" href="vendor/prism.css">
<link rel="stylesheet" href="vendor/katex.css">
<link rel="stylesheet" href="style.css">
<body>
  <div id="rail" class="rail">
    <button id="rail-open" class="icon-btn" type="button" title="Show chat (Ctrl+5)" aria-label="Show chat"></button>
    <span id="rail-dot" class="dot"></span>
    <span id="rail-badge" class="badge" hidden></span>
  </div>
  <main class="chat">
    <header class="appbar chat-bar">
      <span class="avatar" id="avatar"></span>
      <div class="identity">
        <h1>Agent</h1>
        <span class="presence"><span id="presence-dot" class="dot"></span><span id="connection" role="status">Connecting…</span></span>
      </div>
      <span class="spacer"></span>
      <span id="dock-actions" class="actions"><button id="settings" class="icon-btn small" type="button" title="Chat settings" aria-label="Chat settings"></button></span>
    </header>
    <section id="messages" aria-live="polite"><article id="typing" class="typing" role="status" aria-label="Agent is working on a response" hidden><span></span><span></span><span></span></article></section>
    <div id="confirmations" class="confirmations" aria-live="assertive"></div>
    <form id="compose">
      <div class="composer-stack"><div id="preview" class="markdown" aria-live="off" hidden></div><div id="attachments" hidden></div></div>
      <div class="composer-field">
        <textarea id="text" maxlength="12000" placeholder="Message your agent" required></textarea>
        <div id="skill-suggestions" role="listbox" aria-label="Skills" hidden></div>
        <div class="composer-actions">
          <input id="file-input" type="file" multiple hidden>
          <button id="attach" type="button" class="icon-btn small" title="Attach files" aria-label="Attach files"></button>
          <span class="hint"><kbd>Enter</kbd> send · <kbd>Shift</kbd>+<kbd>Enter</kbd> new line</span>
          <button id="send" class="send" title="Send message" aria-label="Send message" disabled></button>
        </div>
      </div>
    </form>
  </main>
  <script src="vendor/prism-init.js"></script>
  <script src="vendor/prism.js"></script>
  <script src="vendor/prism-languages.js"></script>
  <script src="vendor/katex.js"></script>
  <script src="vendor/marked.js"></script>
  <script src="vendor/purify.js"></script>
  <script type="module" src="chat.js"></script>
</body>
</html>

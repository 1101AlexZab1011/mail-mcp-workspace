<!doctype html>
<meta charset="utf-8">
<title>Agent Chat settings</title>
<link rel="stylesheet" href="style.css">
<main class="settings">
  <h1>Agent Chat settings</h1>
  <p>The listener is local-only. Copy the endpoint and token from your private <code>agent-chat.json</code> file.</p>
  <label>Listener URL <input id="endpoint" type="url" value="http://127.0.0.1:46931" required></label>
  <label>Access token <input id="token" type="password" autocomplete="off" required></label>
  <button id="save">Save</button><span id="status" role="status"></span>
</main>
<script src="options.js"></script>

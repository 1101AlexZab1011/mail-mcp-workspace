<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Loom</title>
<link rel="stylesheet" href="shared/ui.css">
<link rel="stylesheet" href="loom.css">
<body>
  <div class="layout">
    <aside class="projects" aria-label="Projects">
      <div class="side-head">
        <strong>Projects</strong>
        <span class="spacer"></span>
        <span id="project-actions" class="actions"></span>
      </div>
      <div id="project-list" class="project-list" role="listbox" aria-label="Projects"></div>
    </aside>
    <section class="main">
      <header class="appbar">
        <span class="glyph" id="glyph"></span>
        <div class="identity">
          <h1 id="title">Loom</h1>
          <span id="subtitle" class="subtitle"></span>
        </div>
        <nav id="views" class="views" role="tablist" aria-label="View"></nav>
        <span class="spacer"></span>
        <span id="actions" class="actions"></span>
      </header>
      <div id="banner" class="banner" hidden></div>
      <div id="content" class="content"></div>
      <footer id="statusbar" class="statusbar"></footer>
    </section>
  </div>
  <script src="vendor/marked.js"></script>
  <script src="vendor/purify.js"></script>
  <script type="module" src="loom.js"></script>
</body>
</html>

  <rect x="24" y="23" width="16" height="13" rx="2.5" fill="none" stroke="#4557d6" stroke-width="2.5"/>
  <path d="M25.5 25 L32 30 L38.5 25" fill="none" stroke="#4557d6" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>

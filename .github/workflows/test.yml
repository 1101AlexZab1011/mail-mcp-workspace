name: test
on: [push, pull_request]
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - run: npm test 2>&1 | tee test-output.txt; exit ${PIPESTATUS[0]}
        shell: bash
        env:
          NODE_OPTIONS: --test-reporter=spec
        timeout-minutes: 15
      - if: failure()
        run: node .github/scripts/annotate.mjs test-output.txt
      - run: npm run chat:addon
